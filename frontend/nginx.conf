server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Ingest payloads carry every markdown file at once; the backend enforces
    # its own limit, this just needs to be no tighter.
    client_max_body_size 64m;

    # Nothing here needs to advertise the patch version.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # Hashed asset filenames are safe to cache indefinitely.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The API is proxied so the browser sees one origin and CORS never applies.
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass         http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_request_buffering off;
    }

    location = /healthz {
        access_log off;
        # default_type rather than add_header, so the security headers included
        # at server level are still inherited here.
        default_type text/plain;
        return 200 "ok\n";
    }

    # Single-page app: unknown paths fall through to the shell.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
