# The chat service, proxied for the same reason /api is: one origin, so
# CORS never applies. nginx checks the session with the backend first and
# passes chat the identity; a 401 never reaches chat. This block comes first
# so the more specific prefix wins over /api/.
location /api/chat/ {
    include /etc/nginx/snippets/security-headers.conf;
    proxy_pass         http://${CHAT_HOST}:${CHAT_PORT};
    proxy_http_version 1.1;
    auth_request       /_auth;
    auth_request_set   $auth_user_id   $upstream_http_x_user_id;
    auth_request_set   $auth_user_role $upstream_http_x_user_role;
    # Set, not appended: replaces anything the browser sent under these names.
    proxy_set_header   X-User-Id         $auth_user_id;
    proxy_set_header   X-User-Role       $auth_user_role;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    # A turn is a model round trip plus several tool calls; a minute is not
    # unusual, and the default 60s read timeout would cut it off mid-answer
    # with no useful error.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
}
