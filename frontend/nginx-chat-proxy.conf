# The chat service, proxied for the same reason /api is: one origin, so
# CORS never applies. Unlike /api it carries no credential -- the chat
# service has no authentication of its own, and the network policy is what
# decides who may reach it. This block comes first so the more specific
# prefix wins over /api/.
location /api/chat/ {
    include /etc/nginx/snippets/security-headers.conf;
    proxy_pass         http://${CHAT_HOST}:${CHAT_PORT};
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    # A turn is a model round trip plus several tool calls; a minute is not
    # unusual, and the default 60s read timeout would cut it off mid-answer
    # with no useful error.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
}
