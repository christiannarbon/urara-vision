# Security headers, shared by every location.
#
# nginx does not inherit add_header into a location that declares its own, so
# this file is included in each block that needs it rather than set once at the
# server level. "always" keeps the headers on error responses too.
#
# The CSP is derived from what the built bundle actually does:
#   script-src 'self'   - the build emits no inline scripts and no eval; the
#                         bundles were checked for both.
#   style-src            - needs 'unsafe-inline' because Cytoscape injects a
#                         <style> element at renderer init to give its
#                         container position:relative. Without it the graph
#                         mispositions. Nothing renders user HTML (no v-html
#                         anywhere), so the XSS surface this would otherwise
#                         cover does not exist here.
#   fonts.googleapis.com / fonts.gstatic.com
#                       - useTheme.ts appends a Google Fonts stylesheet per art
#                         theme, and the faces come from gstatic.
#   img-src data:       - the favicon is an inline SVG data URI in index.html.
#   connect-src 'self'  - the API is same-origin via the /api proxy below. If
#                         VITE_API_BASE is ever built as an absolute URL, that
#                         origin has to be added here.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
# Legacy backstop for browsers that predate frame-ancestors.
add_header X-Frame-Options "DENY" always;
