# Golden question set for the chat agent, over the demo sets in docs/demo/ and the fixtures in
# tests/eval/fixtures/.
#
# Fields:
#   id, set, language, question, category
#   expect_citations     table IDs a correct answer must cite; [] means none expected
#   expect_tools_any     at least one must be called; [] means the context card answers it
#   expect_contains_any  case-insensitive substrings, at least one; used sparingly
#   must_not_contain     substrings that only a wrong or fabricated answer would carry
#
# Categories: lookup, traversal, lineage, diagnostics, conformed, refusal, injection, bilingual.
#
# Every expectation was checked against the document it names, and diagnostic counts match
# backend/tests/unit/demo/. The card carries each table's id, kind, grain and column count plus
# diagnostic totals by severity, so a question it answers expects no tools and no citations.

# --- jaffle-shop-ddd -----------------------------------------------------------------------------

- id: jaffle-columns-orders
  set: jaffle-shop-ddd
