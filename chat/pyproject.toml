[project]
name = "urara-chat"
version = "0.1.0"
description = "Chat service for urara-vision: answers questions about a documented data model"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "langchain-core>=1.6.2",
    "langchain-google-genai>=4.4.0",
    "langgraph>=1.2.11",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urara_chat"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The llm tests call a real provider and are billed. Excluded by default so a
# plain `pytest` never spends money; opt in with `-m llm`, which overrides this.
addopts = "-m 'not llm'"
testpaths = ["tests"]
markers = [
  "integration: needs a running backend (set CHAT_TEST_BACKEND_URL)",
  "llm: calls a real language model and costs money (needs GOOGLE_API_KEY)",
]
