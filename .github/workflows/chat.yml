# Lint, unit tests and integration tests for the Go chat service.
#
# Runnable locally with `make ci-chat`, which drives this file through
# nektos/act. The unit tests also run under backend.yml; this workflow adds the
# triggers on the compose file and the chat manifest that those tests read.
name: chat

on:
  pull_request:
    paths:
      - backend/cmd/chat/**
      - backend/internal/chat/**
      - backend/internal/model/**
      - backend/tests/unit/chat/**
      - backend/tests/integration/chat/**
      - backend/go.mod
      - backend/go.sum
      - k8s/base/chat.yaml
      - docker-compose.yml
      - .github/workflows/chat.yml
  push:
    branches:
      - main
    paths:
      - backend/cmd/chat/**
      - backend/internal/chat/**
      - backend/internal/model/**
      - backend/tests/unit/chat/**
      - backend/tests/integration/chat/**
      - backend/go.mod
      - backend/go.sum
      - k8s/base/chat.yaml
      - docker-compose.yml
      - .github/workflows/chat.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: go vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: go vet
        run: |
          go vet ./cmd/chat/... ./internal/chat/... ./tests/unit/chat/...
          go vet -tags=integration ./tests/integration/chat/...

  test:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # No secret is available to this job: the unit suite needs no provider.
      - name: unit tests
        run: go test -race -count=1 ./tests/unit/chat/...

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    env:
      # 24+ characters, or the backend refuses it. Committed on purpose: it
      # authenticates nothing outside this job.
      API_TOKEN: chat-ci-token-not-for-production
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: chat-ci-admin-password

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: relviz
          POSTGRES_PASSWORD: relviz
          POSTGRES_DB: relviz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relviz -d relviz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/relviz-dev-password
          NEO4J_server_memory_heap_max__size: 1G
          NEO4J_server_memory_pagecache_size: 256m
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: build
        run: |
          go build -o /tmp/urara-server ./cmd/server
          go build -o /tmp/urara-chat ./cmd/chat

      # Nothing here reaches a model: LLM_PROVIDER and VERTEX_PROJECT only have
      # to satisfy start-up validation.
      - name: start the backend and the chat service
        env:
          POSTGRES_DSN: postgres://relviz:relviz@localhost:5432/relviz_test?sslmode=disable
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: relviz-dev-password
          BOOTSTRAP_ADMIN_USERNAME: ${{ env.ADMIN_USERNAME }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ env.ADMIN_PASSWORD }}
          # Plain HTTP, so a Secure cookie would never be sent back.
          COOKIE_SECURE: "false"
          BACKEND_BASE_URL: http://localhost:8080
          BACKEND_API_TOKEN: ${{ env.API_TOKEN }}
          LLM_PROVIDER: vertex
          VERTEX_PROJECT: ci-calls-no-model
        run: |
          set -euo pipefail

          APP_ADDR=":8080" /tmp/urara-server >/tmp/backend.log 2>&1 &
          APP_ADDR="127.0.0.1:8090" /tmp/urara-chat >/tmp/chat.log 2>&1 &

          # Polled rather than slept: a cold Neo4j is slower here than locally.
          wait_for() {
            for _ in $(seq 1 180); do
              if curl -sf "$2" >/dev/null 2>&1; then
                echo "$1 is up"
                return 0
              fi
              sleep 1
            done
            echo "::error::$1 never became healthy"
            return 1
          }

          wait_for backend http://localhost:8080/healthz
          wait_for chat http://localhost:8090/readyz

      - name: integration tests
        env:
          TEST_CHAT_URL: http://localhost:8090
          TEST_CHAT_BACKEND_URL: http://localhost:8080
          TEST_CHAT_API_TOKEN: ${{ env.API_TOKEN }}
          TEST_CHAT_ADMIN_USERNAME: ${{ env.ADMIN_USERNAME }}
          TEST_CHAT_ADMIN_PASSWORD: ${{ env.ADMIN_PASSWORD }}
        run: |
          # act's default shell does not set pipefail; without it tee hides a failure.
          set -o pipefail
          go test -tags=integration -count=1 -v ./tests/integration/chat/... | tee integration.log

      # A suite that quietly stops testing anything is worse than a red one.
      - name: fail if the suite skipped or ran nothing
        run: |
          if grep -q -- "--- SKIP" integration.log; then
            echo "::error::integration tests skipped"
            exit 1
          fi
          if ! grep -q -- "--- PASS" integration.log; then
            echo "::error::no integration tests ran"
            exit 1
          fi

      - name: service logs
        if: failure()
        run: |
          echo "::group::backend"
          cat /tmp/backend.log || true
          echo "::endgroup::"
          echo "::group::chat"
          cat /tmp/chat.log || true
          echo "::endgroup::"
