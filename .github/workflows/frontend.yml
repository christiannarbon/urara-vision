# Typecheck, unit tests and a production build for the Vue app.
name: frontend

on:
  pull_request:
    paths:
      - frontend/**
      - .github/workflows/frontend.yml
  push:
    branches:
      - main
    paths:
      - frontend/**
      - .github/workflows/frontend.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    name: typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Matches the node the frontend image builds on.
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly the lockfile and
      # fails if package.json and the lock have drifted apart.
      - name: install
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: unit and component tests
        run: npm run test:run

      - name: build
        run: npm run build

      # The CSP served by nginx assumes the bundle has no inline script and no
      # eval. If a dependency ever introduces one the page breaks in a way that
      # only shows up in a browser console, so it is worth asserting here.
      - name: check the build still satisfies the CSP
        run: |
          if grep -q "<script>" dist/index.html; then
            echo "::error::dist/index.html contains an inline script, which script-src 'self' blocks"
            exit 1
          fi
          if grep -REq "new Function\(|\(0,eval\)" dist/assets/*.js; then
            echo "::error::the bundle uses eval, which script-src 'self' blocks"
            grep -RElo "new Function\(|\(0,eval\)" dist/assets/*.js
            exit 1
          fi
