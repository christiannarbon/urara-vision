# Leaves the chat service out: every chat resource is removed, and the backend
# and frontend are told it is not deployed.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target:
      kind: Service
      name: chat
    patch: |
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: chat
  - target:
      kind: ServiceAccount
      name: chat
    patch: |
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: chat
  - target:
      kind: Deployment
      name: chat
    patch: |
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: chat
  - target:
      kind: ConfigMap
      name: relviz-chat-config
    patch: |
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: relviz-chat-config
  # A target that matches nothing is a no-op, so this is safe on top of dev,
  # which already deletes the chat PDB.
  - target:
      kind: PodDisruptionBudget
      name: chat
    patch: |
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: chat
  - target:
      kind: NetworkPolicy
      name: chat-allow-frontend
    patch: |
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: chat-allow-frontend
  # The backend's chat peer. `test` fails the render if the policy is reordered.
  - target:
      kind: NetworkPolicy
      name: backend-allow-frontend-chat
    patch: |
      - op: test
        path: /spec/ingress/0/from/1/podSelector/matchLabels/app.kubernetes.io~1name
        value: chat
      - op: remove
        path: /spec/ingress/0/from/1
  - target:
      kind: Deployment
      name: backend
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
      spec:
        template:
          spec:
            containers:
              - name: backend
                env:
                  - name: CHAT_ENABLED
                    value: "false"
  - target:
      kind: Deployment
      name: frontend
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend
      spec:
        template:
          spec:
            containers:
              - name: frontend
                env:
                  - name: CHAT_ENABLED
                    value: "false"
