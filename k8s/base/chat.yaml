apiVersion: v1
kind: Service
metadata:
  name: chat
  labels:
    app.kubernetes.io/name: chat
    app.kubernetes.io/component: chat
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: chat
  ports:
    - name: http
      port: 8090
      targetPort: http
---
# The model credential is ADC, so the pod needs an identity of its own: on GKE,
# annotate this with iam.gke.io/gcp-service-account and the token comes from the
# metadata server, nothing mounted. The default ServiceAccount cannot be
# annotated without handing that identity to every other pod in the namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chat
  labels:
    app.kubernetes.io/name: chat
    app.kubernetes.io/component: chat
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat
  labels:
    app.kubernetes.io/name: chat
    app.kubernetes.io/component: chat
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: chat
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chat
        app.kubernetes.io/component: chat
    spec:
      serviceAccountName: chat
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # The root filesystem is read-only, and Python still wants somewhere to
        # write. A local cluster has no metadata server, so the dev overlay adds
        # an ADC file volume next to this one; prod must not, or the file
        # shadows Workload Identity.
        - name: tmp
          emptyDir: {}
      containers:
        - name: chat
          image: urara-vision/chat:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
          envFrom:
            - configMapRef:
                name: relviz-chat-config
          env:
            - name: TMPDIR
              value: /tmp
            # The same secret the backend reads as API_TOKEN, so there is one
            # token to rotate rather than two.
            - name: BACKEND_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: relviz-api
                  key: token
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # /readyz checks the backend, so a backend outage takes chat pods out
          # of service rather than leaving them accepting questions they cannot
          # answer. /healthz deliberately does not: kubelet must never restart a
          # chat pod because its dependency is down.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              # Higher than the backend's 512Mi: an interpreter with LangChain
              # imported has a much larger resident set than the Go binary, and
              # the backend's ceiling would OOM it.
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: relviz-chat-config
data:
  APP_ADDR: ":8090"
  BACKEND_BASE_URL: "http://backend:8080"
  LOG_LEVEL: "info"
  # Vertex authenticates with ADC, so no key belongs here or in any secret.
  LLM_PROVIDER: "vertex"
  LLM_MODEL: "gemini-2.5-flash"
  # Set per overlay; the pod refuses to start without it.
  VERTEX_PROJECT: ""
  VERTEX_LOCATION: "us-central1"
  MAX_TOOL_ITERATIONS: "6"
  MAX_HISTORY_MESSAGES: "20"
  MAX_CONCURRENT_TURNS: "4"
  MAX_QUESTION_CHARS: "4000"
  CONTEXT_CACHE_TTL_SECONDS: "300"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: chat
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chat
