# The datastores accept traffic only from the backend. The backend accepts it
# from the frontend and from chat; chat accepts it only from the frontend.
# Ingress reaches the frontend directly.
#
# Chat deliberately has no path to either datastore: it reads and writes
# everything through the backend's API, which is what keeps the graph
# projection's invariants in one place and keeps a prompt injection unable to
# reach a database session.
#
# These are ingress-only policies -- nothing here restricts egress, which is why
# chat's outbound call to the Gemini endpoint needs no rule. If a default-deny
# egress policy is ever added, chat will need 443 to the provider plus DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-backend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: backend
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: neo4j-allow-backend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: neo4j
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: backend
      ports:
        - protocol: TCP
          port: 7687
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-allow-frontend-chat
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: backend
  policyTypes: ["Ingress"]
  ingress:
    # Two entries, not two labels in one selector: list items are ORed, while
    # selectors within an item are ANDed and would match neither pod.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: frontend
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: chat
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chat-allow-frontend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: chat
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: frontend
      ports:
        - protocol: TCP
          port: 8090
