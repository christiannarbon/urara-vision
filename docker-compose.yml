name: urara-vision

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relviz
      POSTGRES_PASSWORD: relviz
      POSTGRES_DB: relviz
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relviz -d relviz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/relviz-dev-password
      # The default heap is generous for a graph this size; keep the container
      # small enough to run comfortably alongside everything else.
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ADDR: ":8080"
      POSTGRES_DSN: "postgres://relviz:relviz@postgres:5432/relviz?sslmode=disable"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "relviz-dev-password"
      # A committed dev token, the same one the k8s dev overlay uses. The API
      # is authenticated here for the same reason it is there: so the path
      # that runs in production is the path that runs locally.
      API_TOKEN: "relviz-dev-token-not-for-production"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:8081"
      LOG_LEVEL: "info"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  chat:
    build:
      context: ./chat
      dockerfile: Dockerfile
    environment:
      APP_ADDR: ":8090"
      BACKEND_BASE_URL: "http://backend:8080"
      # The same committed dev token the frontend presents. The chat service
      # is an API client like any other.
      BACKEND_API_TOKEN: "relviz-dev-token-not-for-production"
      LOG_LEVEL: "info"
      # The only settings in this file that are not committed values. They come
      # from the host environment or a .env file, because a model credential is
      # the one thing here that must never be in the repository.
      #
      # No key has a default. The empty fallback is deliberate: the service
      # refuses to start without the credential its provider needs, and naming
      # the missing variable in the log beats starting misconfigured and failing
      # every request.
      #
      # Vertex authenticates with Application Default Credentials rather than a
      # key, which under compose means mounting the host's ADC file. That is not
      # configured here -- see chat/README.md -- because it fails confusingly on
      # a machine with no gcloud.
      LLM_PROVIDER: "${LLM_PROVIDER:-gemini-studio}"
      LLM_MODEL: "${LLM_MODEL:-gemini-2.5-flash}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      VERTEX_PROJECT: "${VERTEX_PROJECT:-}"
      VERTEX_LOCATION: "${VERTEX_LOCATION:-us-central1}"
    ports:
      - "8090:8090"
    depends_on:
      # service_started rather than service_healthy: the backend declares no
      # compose healthcheck, and this service's own readiness probe already
      # reports a backend that is not up yet.
      backend:
        condition: service_started
    healthcheck:
      # The final image is a slim Python base with neither curl nor wget, so the
      # check is made with the interpreter that is definitely there.
      test:
        - CMD
        - python
        - -c
        - import urllib.request;urllib.request.urlopen('http://localhost:8090/healthz')
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked in at build time; the nginx config also proxies /api to the
        # backend so a same-origin relative base works out of the box.
        VITE_API_BASE: "/api/v1"
    environment:
      # nginx presents the backend's token on the browser's behalf, so
      # localhost:8081 opens without anyone being asked for a key.
      API_AUTHORIZATION: "Bearer relviz-dev-token-not-for-production"
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
  neo4j-data:
  neo4j-logs:
