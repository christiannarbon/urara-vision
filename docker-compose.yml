name: urara-vision

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relviz
      POSTGRES_PASSWORD: relviz
      POSTGRES_DB: relviz
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relviz -d relviz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/relviz-dev-password
      # The default heap is generous for a graph this size; keep the container
      # small enough to run comfortably alongside everything else.
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ADDR: ":8080"
      POSTGRES_DSN: "postgres://relviz:relviz@postgres:5432/relviz?sslmode=disable"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "relviz-dev-password"
      # A committed dev token, the same one the k8s dev overlay uses. The API
      # is authenticated here for the same reason it is there: so the path
      # that runs in production is the path that runs locally.
      API_TOKEN: "relviz-dev-token-not-for-production"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:8081"
      LOG_LEVEL: "info"
      CHAT_ENABLED: "${CHAT_ENABLED:-true}"
      # Plain HTTP on localhost, so the session cookie cannot be Secure.
      COOKIE_SECURE: "false"
      # Browser → frontend nginx → backend.
      TRUSTED_PROXY_HOPS: "1"
      # Committed dev values like the token above; created only on an empty users table.
      BOOTSTRAP_ADMIN_USERNAME: "${BOOTSTRAP_ADMIN_USERNAME:-admin}"
      BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD:-relviz-dev-admin-password}"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  chat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: chat
    environment:
      # Every setting the service reads, as ${VAR:-default}: compose passes only
      # the variables named here. backend/tests/unit/chat/config/manifests_test.go
      # fails if one is missing. APP_ADDR is a literal because the port is mapped
      # from :8090.
      APP_ADDR: ":8090"

      BACKEND_BASE_URL: "${BACKEND_BASE_URL:-http://backend:8080}"
      # The committed dev token the backend checks.
      BACKEND_API_TOKEN: "${BACKEND_API_TOKEN:-relviz-dev-token-not-for-production}"
      BACKEND_TIMEOUT_SECONDS: "${BACKEND_TIMEOUT_SECONDS:-30}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"

      MAX_CONCURRENT_TURNS: "${MAX_CONCURRENT_TURNS:-4}"
      TURN_ADMISSION_WAIT_SECONDS: "${TURN_ADMISSION_WAIT_SECONDS:-0.5}"
      MAX_QUESTION_CHARS: "${MAX_QUESTION_CHARS:-4000}"
      MAX_REQUEST_BYTES: "${MAX_REQUEST_BYTES:-1048576}"
      ANSWER_TIMEOUT_SECONDS: "${ANSWER_TIMEOUT_SECONDS:-120}"

      MAX_HISTORY_MESSAGES: "${MAX_HISTORY_MESSAGES:-20}"
      MAX_TOOL_ITERATIONS: "${MAX_TOOL_ITERATIONS:-6}"
      MAX_TURN_TOKENS: "${MAX_TURN_TOKENS:-32000}"
      MAX_CONVERSATION_TURNS: "${MAX_CONVERSATION_TURNS:-50}"
      CONTEXT_CACHE_TTL_SECONDS: "${CONTEXT_CACHE_TTL_SECONDS:-300}"
      FEATURES_CACHE_SECONDS: "${FEATURES_CACHE_SECONDS:-15}"

      # Vertex authenticates with ADC, mounted by docker-compose.override.yml.
      # VERTEX_PROJECT has no default: the service refuses to start without one.
      LLM_PROVIDER: "${LLM_PROVIDER:-vertex}"
      LLM_MODEL: "${LLM_MODEL:-gemini-2.5-flash}"
      LLM_TEMPERATURE: "${LLM_TEMPERATURE:-0.2}"
      LLM_MAX_OUTPUT_TOKENS: "${LLM_MAX_OUTPUT_TOKENS:-2048}"
      LLM_TIMEOUT_SECONDS: "${LLM_TIMEOUT_SECONDS:-60}"
      VERTEX_PROJECT: "${VERTEX_PROJECT:-}"
      VERTEX_LOCATION: "${VERTEX_LOCATION:-us-central1}"
    # Localhost only: chat trusts the identity headers nginx sets.
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      # The backend has no healthcheck; chat's /readyz reports it instead.
      backend:
        condition: service_started
    # No healthcheck: the distroless image has no shell or client to run one.
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked in at build time; the nginx config also proxies /api to the
        # backend so a same-origin relative base works out of the box.
        VITE_API_BASE: "/api/v1"
    environment:
      # The /api/chat/ upstream, substituted into the nginx config at start.
      CHAT_HOST: "${CHAT_HOST:-chat}"
      CHAT_PORT: "8090"
      # false serves a 503 at /api/chat/ instead of proxying to chat.
      CHAT_ENABLED: "${CHAT_ENABLED:-true}"
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_started
      # nginx resolves the chat host at startup, so chat starts first when it
      # runs at all. Optional for CHAT_ENABLED=false, where it is never proxied.
      chat:
        condition: service_started
        required: false
    restart: unless-stopped

volumes:
  postgres-data:
  neo4j-data:
  neo4j-logs:
