name: urara-vision

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relviz
      POSTGRES_PASSWORD: relviz
      POSTGRES_DB: relviz
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relviz -d relviz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/relviz-dev-password
      # The default heap is generous for a graph this size; keep the container
      # small enough to run comfortably alongside everything else.
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ADDR: ":8080"
      POSTGRES_DSN: "postgres://relviz:relviz@postgres:5432/relviz?sslmode=disable"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "relviz-dev-password"
      # Unset, so /api/v1 needs no credential locally. Set it to 24+ characters
      # to exercise the token gate; the frontend will prompt for it.
      # API_TOKEN: "local-development-token-0123456789"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:8081"
      LOG_LEVEL: "info"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked in at build time; the nginx config also proxies /api to the
        # backend so a same-origin relative base works out of the box.
        VITE_API_BASE: "/api/v1"
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
  neo4j-data:
  neo4j-logs:
